version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"

    open-pull-requests-limit: 5

    groups:
      # OpenTelemetry packages are version-coupled (SDK 1.x/2.x/3.x plus 0.x
      # experimental packages whose minors are breaking), so they are bumped
      # together in ONE PR, including majors. Expect CI to fail on it until
      # src/instrumentation.ts is migrated; keep it open as a reminder.
      opentelemetry:
        patterns:
          - "@opentelemetry/*"
      # vitest, @vitest/ui and @vitest/coverage-v8 must share the same major
      # version, so bump them together (majors included).
      vitest:
        patterns:
          - "vitest"
          - "@vitest/*"
      minor-and-patch:
        patterns:
          - "*"
        exclude-patterns:
          - "@opentelemetry/*"
          - "vitest"
          - "@vitest/*"
        update-types:
          - "minor"
          - "patch"
    labels:
      - "not merge"