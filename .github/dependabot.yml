version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"

    open-pull-requests-limit: 5

    groups:
      minor-and-patch:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"
    # OpenTelemetry packages are version-coupled (SDK 1.x/2.x/3.x plus 0.x
    # experimental packages whose minors are breaking), so skip major/minor
    # version bumps until they are migrated together. Patch bumps and
    # security updates still come through (update-types only affects
    # version updates). Remove this block after the migration.
    ignore:
      - dependency-name: "@opentelemetry/*"
        update-types:
          - "version-update:semver-major"
          - "version-update:semver-minor"
    labels:
      - "not merge"